<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared.css"></head>
<body><canvas id="c"></canvas><div class="label">Superposition · drag the sliders</div>
<div class="panel">
  <label for="f1">f₁</label><input id="f1" type="range" min="0.5" max="6" step="0.1" value="1"><output id="o-f1"></output>
  <label for="f2">f₂</label><input id="f2" type="range" min="0.5" max="6" step="0.1" value="1.5"><output id="o-f2"></output>
  <label for="a2">A₂</label><input id="a2" type="range" min="0" max="1" step="0.05" value="0.6"><output id="o-a2"></output>
  <label for="v">speed</label><input id="v" type="range" min="0" max="2" step="0.1" value="0.5"><output id="o-v"></output>
</div>
<script type="module" src="waves.js"></script></body></html>
